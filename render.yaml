# Render Blueprint (free Web Service + your Neon database). New + > Blueprint > pick this repo.
services:
  - type: web
    name: personal-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL     # your Neon connection string (settings live here, so redeploys don't reset them)
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION
        sync: false
      - key: GROQ_API_KEY
        sync: false
